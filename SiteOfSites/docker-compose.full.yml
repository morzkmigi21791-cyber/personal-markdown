services:
  # PostgreSQL база данных
  postgres:
    image: postgres:15-alpine
    container_name: siteofsites_postgres
    environment:
      POSTGRES_DB: siteofsites
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Sctorlorn25565
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    ports:
      - "5432:5432"
    networks:
      - siteofsites_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MinIO для хранения файлов
  minio:
    image: quay.io/minio/minio:latest
    container_name: siteofsites_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: Qwerty
      MINIO_ROOT_PASSWORD: 19216811!
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9001
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - siteofsites_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: siteofsites_backend
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=Sctorlorn25565
      - DB_NAME=siteofsites
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=Qwerty
      - MINIO_SECRET_KEY=19216811!
      - MINIO_SECURE=False
      - MINIO_BUCKET_NAME=mybucket
      - AI_SERVICE_URL=http://ai_bot:8001
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost,http://127.0.0.1:3000,http://127.0.0.1,https://commonly-uplifting-broadbill.cloudpub.ru
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      ai_bot:
        condition: service_started
    env_file:
      - ./.env
    networks:
      - siteofsites_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # AI Chat Bot Service
  ai_bot:
    build:
      context: ./robot
      dockerfile: Dockerfile
    container_name: siteofsites_ai
    ports:
      - "8001:8001"
    networks:
      - siteofsites_network
    restart: unless-stopped

  # Frontend React приложение
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: siteofsites_frontend
    env_file:
      - ./.env
    environment:
      - REACT_APP_API_URL=https://commonly-uplifting-broadbill.cloudpub.ru
      - GENERATE_SOURCEMAP=false
      - WDS_SOCKET_PORT=0
      - DANGEROUSLY_DISABLE_HOST_CHECK=true
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - siteofsites_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: siteofsites_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_cache:/var/cache/nginx
      - nginx_logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    networks:
      - siteofsites_network
    restart: unless-stopped
    environment:
      - TZ=Europe/Moscow
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  minio_data:
  nginx_cache:
  nginx_logs:

networks:
  siteofsites_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
