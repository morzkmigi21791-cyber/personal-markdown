version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: siteofsites_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - minio
    networks:
      - siteofsites_network
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    container_name: siteofsites_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: Qwerty
      MINIO_ROOT_PASSWORD: 19216811!
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - siteofsites_network
    restart: unless-stopped

volumes:
  minio_data:

networks:
  siteofsites_network:
    driver: bridge
