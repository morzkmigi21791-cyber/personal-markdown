events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    # Логирование
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;
    
    # Основные настройки
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    
    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;
    
    # Upstream для FastAPI backend
    upstream backend {
        server host.docker.internal:8000;
    }
    
    # Основной сервер для API и админки
    server {
        listen 80;
        server_name localhost siteofsites.local;
        
        # API endpoints
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Frontend (React app)
        location / {
            proxy_pass http://host.docker.internal:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
    
    # Сервер для поддоменов сайтов
    server {
        listen 80;
        server_name ~^(?<subdomain>.+)\.localhost$;
        
        # Проксируем запросы к API для получения информации о сайте
        location / {
            # Сначала пытаемся получить файл напрямую через API
            proxy_pass http://backend/api/sites/$subdomain$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Если файл не найден, показываем 404
            proxy_intercept_errors on;
            error_page 404 = @fallback;
        }
        
        # Fallback для несуществующих сайтов
        location @fallback {
            return 404 '<!DOCTYPE html>
<html>
<head>
    <title>Сайт не найден</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; }
        .error { color: #666; }
    </style>
</head>
<body>
    <h1>Сайт не найден</h1>
    <p class="error">Сайт с поддоменом <strong>'$subdomain'</strong> не существует или неактивен.</p>
    <p><a href="http://localhost">Вернуться на главную</a></p>
</body>
</html>';
        }
    }
    
    # Дополнительный сервер для поддоменов с портом 3000
    server {
        listen 3000;
        server_name ~^(?<subdomain>.+)\.localhost$;
        
        location / {
            proxy_pass http://backend/api/sites/$subdomain$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_intercept_errors on;
            error_page 404 = @fallback;
        }
        
        location @fallback {
            return 404 '<!DOCTYPE html>
<html>
<head>
    <title>Сайт не найден</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; }
        .error { color: #666; }
    </style>
</head>
<body>
    <h1>Сайт не найден</h1>
    <p class="error">Сайт с поддоменом <strong>'$subdomain'</strong> не существует или неактивен.</p>
    <p><a href="http://localhost:3000">Вернуться на главную</a></p>
</body>
</html>';
        }
    }
}
